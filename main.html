<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, main{
            height: 100vh;
            width: 100vw;
        }
        main#loading{
            display: none;
        }
        main#loading.visible {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            justify-content: center;
            align-items: center;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        main#loading.visible div {
            color: #333;
        }
        main#loading.visible h1 {
            display: inline-block;
         }
         main#loading.visible h1 span:nth-child(1){
          animation:1.5s .5s blink linear infinite;
        }
        main#loading.visible h1 span:nth-child(2){
          animation: 1.5s 1s blink linear infinite;
        }
        main#loading.visible h1 span:nth-child(3){
          animation: 1.5s 1.5s blink linear infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <main id="loading" class="visible">
      <div>
        <h1>Loading<span>.</span><span>.</span><span>.</span></h1>
      </div>
    </main>
   
</body>
</html>
