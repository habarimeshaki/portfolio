<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Single-Page Template</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f9f9fb; color: #333; margin: 0; padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box;">

    <!-- Single Centered Container -->
    <div style="background: #ffffff; padding: 40px; border-radius: 12px; max-width: 500px; width: 100%; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); text-align: center;">
        
        <!-- Header Section -->
        <h1 style="color: #2c3e50; margin-top: 0; font-size: 26px;">Hello There!</h1>
        <p style="color: #666; font-size: 15px; line-height: 1.6; margin-bottom: 30px;">
            This is a clean, beginner-friendly layout designed to fit perfectly on a single page without clutter.
        </p>

        <!-- Call to Action Button (Basic & Advanced Styling) -->
        <a href="#" style="display: inline-block; background-color: #3498db; color: white; padding: 12px 25px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 14px; box-shadow: 0 2px 6px rgba(52, 152, 219, 0.3);">
            Get Started
        </a>

        <!-- Simple Footer Note -->
        <p style="margin-top: 40px; font-size: 12px; color: #aaa;">
            Built with simple inline styles for easy learning.
        </p>

    </div>

</body>
</html>
